<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Trionix ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1e40af 100%); min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .input-field { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.15); border-radius: 12px; color: white; font-size: 14px; transition: all 0.2s; outline: none; }
        .input-field::placeholder { color: rgba(255,255,255,0.4); }
        .input-field:focus { border-color: #60a5fa; background: rgba(255,255,255,0.12); }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-gradient-to-br from-blue-400 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span class="text-white font-black text-xl">T</span>
            </div>
        </div>
        <div class="glass rounded-2xl p-8">
            <div class="text-center mb-6">
                <div class="w-14 h-14 bg-blue-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-envelope text-blue-400 text-2xl"></i>
                </div>
                <h2 class="text-white font-700 text-xl">Reset Password</h2>
                <p class="text-slate-400 text-sm mt-1">Enter your email to receive reset instructions</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
            <div class="mb-4 p-3 rounded-xl text-sm font-500 bg-blue-500/20 text-blue-300 border border-blue-500/30">{{ message }}</div>
            {% endfor %}{% endif %}{% endwith %}
            <form method="POST">
                <div>
                    <label class="block text-slate-300 text-sm font-600 mb-1.5">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="email" name="email" placeholder="your@email.com" required class="input-field pl-11">
                    </div>
                </div>
                <button type="submit" class="w-full mt-4 py-3 bg-blue-600 hover:bg-blue-500 text-white font-700 rounded-xl transition-all">
                    Send Reset Link
                </button>
            </form>
            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-blue-400 text-sm hover:text-blue-300">
                    <i class="fa-solid fa-arrow-left mr-1"></i>Back to Login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
